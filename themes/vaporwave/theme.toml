# SPDX-License-Identifier: GPL-3.0-or-later
name = "Vaporwave"
description = "Néons rose, cyan et violet, fausse fenêtre de chargement nostalgique et lecteur CD façon Windows 95. Hommage à l'univers vaporwave, créations originales."
author = "Antoine Piron"
palette = "vaporwave"        # palette.json is installed as palettes/<palette>.json
preview = "preview.webp"

# Labels for the app's show/hide switches; a group toggles all its widgets together.
[widget_groups]
"Horloge" = ["vw-clock"]
"Katakana vertical" = ["vw-katakana"]
"Lecteur CD" = ["vw-player-frame", "vw-player"]
"Boîte de dialogue" = ["vw-dialog"]
