# Noctalia config fragment, installed as ~/.config/noctalia/zz-theme.toml.
# The THEME_DIR and OUTPUT placeholders, between @ signs, are filled in at install. Coordinates are logical (designed on 1536x864); rotation is in radians.

[theme]
source = "custom"
custom_palette = "vaporwave"
mode = "dark"
shell_mode = "dark"   # "auto" would otherwise keep the bar light
pure_black_dark = false  # keep the indigo night surfaces

[wallpaper]
transition = ["pixel", "melt", "stripes", "wipe"]
transition_duration = 1800
edge_smoothness = 0.15

[desktop_widgets]
enabled = true
widget_order = ["vw-clock", "vw-katakana", "vw-player", "vw-dialog"]  # later = on top

# Heavy weight, top-left: the clock anchors the frame.
[desktop_widgets.widget.vw-clock]
type = "clock"
output = "@OUTPUT@"
cx = 280.0
cy = 190.0
box_width = 440.0
box_height = 150.0
rotation = 0.0

[desktop_widgets.widget.vw-clock.settings]
clock_style = "digital"
format = "{:%H:%M}"
font_family = "Noto Sans CJK JP"
color = "primary"
shadow = true
background = false

# Vertical line on the right edge: katakana for "vaporwave".
[desktop_widgets.widget.vw-katakana]
type = "label"
output = "@OUTPUT@"
cx = 1480.0
cy = 470.0
box_width = 560.0
box_height = 64.0
rotation = 1.5708

[desktop_widgets.widget.vw-katakana.settings]
title = "ヴェイパーウェイヴ"
description = "ＡＥＳＴＨＥＴＩＣＳ　２０２６"
color = "secondary"
shadow = true
background = false

# Counterweight bottom-left: a fake Win95 CD player window around Noctalia's media player
# Counterweight bottom-left: a fake Win95 CD player window, drawn with its content by one plugin widget
# (metadata + cover only, no audio capture: stays in sync even over AirPlay).
[desktop_widgets.widget.vw-player]
type = "billisdead/now-playing:card"  # plugin shipped in plugins/now-playing, installed with the theme
output = "@OUTPUT@"
cx = 230.0
cy = 670.0
box_width = 340.0
box_height = 150.0
rotation = 0.0

[desktop_widgets.widget.vw-player.settings]
frame = "@THEME_DIR@/stickers/player_frame"  # bands cut by tools/slice_frame.py
fill = "surface"
color = "on_surface"

# Tension, bottom-right: a slightly tilted fake dialog.
[desktop_widgets.widget.vw-dialog]
type = "sticker"
output = "@OUTPUT@"
cx = 1190.0
cy = 650.0
box_width = 380.0
box_height = 170.0
rotation = -0.07

[desktop_widgets.widget.vw-dialog.settings]
image_path = "@THEME_DIR@/stickers/dialog-loading.png"
opacity = 1.0
background = false
